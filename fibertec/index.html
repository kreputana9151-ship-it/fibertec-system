<!DOCTYPE html>
<html lang="en">
<head>
  <title>FiberTec - Sign in</title>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
<div class="lg">
  <div class="lg-left">
    <img src="images/logo.jpeg" alt="FiberTec IT Solutions" class="lg-logo">
    <h1>Welcome to FiberTec.</h1>
    <p>Fast and Reliable Internet Services for your personal and business needs</p>
  </div>
  <div class="lg-right">
    <form class="lg-form" onsubmit="login();return false;">
      <h2>Sign in</h2>
      <p class="lg-sub">Use your FiberTec account number</p>
      <label>Account number</label>
      <input type="text" id="account" autocomplete="username">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <p class="error" id="error"></p>
      <button type="submit" class="lg-btn">Sign In</button>
      <p class="lg-hint">Demo: client 05261001 &nbsp;|&nbsp; staff: staff01 to staff07 (one per branch) &nbsp;|&nbsp; admin: admin01 (any non-empty password)<br>
        All data is dummy data stored in your browser. <button type="button" class="lg-reset" onclick="resetDemoData()">Reset demo data</button></p>
    </form>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
</body>
</html>
